<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Kaustubh Salunke — AI / ML Engineer</title>
  <meta name="description" content="Kaustubh Salunke. AI / ML Engineer based in Berlin. Production GenAI, agentic systems, ML pipelines."/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Inter+Tight:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="swiss.css"/>
</head>
<body>
  <div id="root"></div>
  <div class="ks-loading" id="ks-loading">Loading</div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="swiss-hooks.jsx"></script>
  <script type="text/babel" src="swiss-sections-1.jsx"></script>
  <script type="text/babel" src="swiss-sections-2.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useMemo } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "hero": "classic",
      "glitch": "subtle"
    }/*EDITMODE-END*/;

    const SECTIONS = [
      { id: "now",          n: "01", label: "Now" },
      { id: "about",        n: "02", label: "About" },
      { id: "work",         n: "03", label: "Work" },
      { id: "stack",        n: "04", label: "Stack" },
      { id: "process",      n: "05", label: "Process" },
      { id: "writing",      n: "06", label: "Writing" },
      { id: "lab",          n: "07", label: "Lab" },
      { id: "testimonials", n: "08", label: "Words" },
      { id: "career",       n: "09", label: "Career" },
      { id: "contact",      n: "10", label: "Contact" }
    ];

    const App = () => {
      const data = window.PORTFOLIO;
      const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
      const progress = window.useScrollProgress();
      const current = window.useSectionTracker(SECTIONS.map(s => s.id));
      const clock = window.useClock("Europe/Berlin");
      const [stuck, setStuck] = useState(false);

      // hero glitch word cycle
      const glitchWords = useMemo(() => ["production", "agentic", "retrieval", "graphs", "guardrails"], []);
      const [gw, setGw] = useState(0);
      useEffect(() => {
        const t = setInterval(() => setGw(g => (g + 1) % glitchWords.length), 2400);
        return () => clearInterval(t);
      }, [glitchWords.length]);

      useEffect(() => {
        const onScroll = () => setStuck(window.scrollY > 80);
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      useEffect(() => {
        const el = document.getElementById("ks-loading");
        if (el) setTimeout(() => el.remove(), 200);
      }, []);

      // Reveal sections — adds is-revealed for the red/ink line wipe
      useEffect(() => {
        const io = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("is-revealed"); });
        }, { threshold: 0.05 });
        document.querySelectorAll(".ks-section").forEach(el => io.observe(el));
        return () => io.disconnect();
      }, []);

      return (
        <div className="ks ks-jitter" data-glitch={tweaks.glitch}>
          <div className="ks-progress"><span style={{ width: (progress * 100).toFixed(2) + "%" }}/></div>

          <nav className={"ks-nav" + (stuck ? " is-stuck" : "")}>
            <div className="ks-nav-inner">
              <div className="ks-mark"><b>Kaustubh Salunke</b><span>AI / ML Engineer</span></div>
              <div className="ks-nav-list">
                {SECTIONS.map(s => (
                  <a key={s.id} href={"#" + s.id} className={"ks-link" + (current === s.id ? " is-current" : "")}>
                    <span>{s.n}</span>{s.label}
                  </a>
                ))}
              </div>
              <div className="ks-nav-end">
                <span className="ks-clock">Berlin <b>{clock}</b></span>
              </div>
            </div>
          </nav>

          <window.Hero data={data} hero={tweaks.hero} glitchWord={glitchWords[gw]} clock={clock}/>

          <main>
            <window.NowPlaying    data={data}/>
            <window.About         data={data}/>
            <window.Work          data={data}/>
            <window.Stack         data={data}/>
            <window.Process       data={data}/>
            <window.Writing       data={data}/>
            <window.Lab/>
            <window.Testimonials  data={data}/>
            <window.Career        data={data}/>
            <window.Contact       data={data}/>
          </main>

          <footer className="ks-foot">
            <div className="ks-grid">
              <div className="ks-foot-l">© 2026 {data.identity.name} · Berlin · all sections, no shortcuts</div>
              <div className="ks-foot-r">Set in Helvetica Neue &amp; JetBrains Mono · ink only</div>
            </div>
          </footer>

          <window.TweaksPanel title="Swiss tweaks">
            <window.TweakSection label="Hero treatment">
              <window.TweakRadio
                value={tweaks.hero}
                onChange={v => setTweak("hero", v)}
                options={[
                  { value: "classic",    label: "Classic — type + sidebar" },
                  { value: "fillscreen", label: "Fillscreen — name dominates" },
                  { value: "runner",     label: "Terminal runner" }
                ]}/>
            </window.TweakSection>
            <window.TweakSection label="Glitch intensity">
              <window.TweakRadio
                value={tweaks.glitch}
                onChange={v => setTweak("glitch", v)}
                options={[
                  { value: "subtle", label: "Subtle (default)" },
                  { value: "medium", label: "Medium — RGB + shake" },
                  { value: "heavy",  label: "Heavy — CRT scanlines" }
                ]}/>
            </window.TweakSection>
          </window.TweaksPanel>
        </div>
      );
    };

    const tryMount = () => {
      const ok = window.PORTFOLIO && window.Hero && window.NowPlaying && window.About && window.Work && window.Stack && window.Process && window.Writing && window.Lab && window.Testimonials && window.Career && window.Contact && window.useTweaks && window.TweaksPanel;
      if (!ok) { setTimeout(tryMount, 50); return; }
      ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
    };
    tryMount();
  </script>
</body>
</html>
